<!-- Save as expense-app.html and open in browser -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<expense-app></expense-app>
<script type="module">
    class ExpenseApp extends HTMLElement {
        constructor() {
            super();
            this.attachShadow({ mode: 'open' });
            this.shadowRoot.innerHTML = `
          <style>
            :host {
              font-family: 'Segoe UI', Arial, sans-serif;
              background: #f4f6f8;
              color: #222;
              display: block;
              min-height: 100vh;
            }
            .container {
              max-width: 480px;
              margin: 40px auto;
              background: #fff;
              border-radius: 12px;
              box-shadow: 0 4px 24px rgba(0,0,0,0.08);
              padding: 32px 32px 24px 32px;
            }
            h2 {
              margin-top: 32px;
              margin-bottom: 12px;
              font-size: 1.25rem;
              color: #2a3b4d;
              font-weight: 600;
              letter-spacing: 0.01em;
            }
            form {
              display: flex;
              flex-direction: column;
              gap: 12px;
              margin-bottom: 16px;
            }
            input, button {
              font-size: 1rem;
              padding: 10px 12px;
              border-radius: 6px;
              border: 1px solid #cfd8dc;
              outline: none;
              transition: border 0.2s;
            }
            input:focus {
              border-color: #1976d2;
              background: #f0f7ff;
            }
            button {
              background: linear-gradient(90deg, #1976d2 0%, #1565c0 100%);
              color: #fff;
              border: none;
              font-weight: 600;
              cursor: pointer;
              box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
              transition: background 0.2s;
            }
            button:hover {
              background: linear-gradient(90deg, #1565c0 0%, #1976d2 100%);
            }
            #result {
              margin: 18px 0 0 0;
              padding: 10px 14px;
              background: #e3f2fd;
              color: #1976d2;
              border-radius: 6px;
              font-size: 0.98rem;
              min-height: 24px;
              word-break: break-all;
            }
            #expenseTitle {
              font-weight: 600;
              margin: 28px 0 10px 0;
              font-size: 1.1rem;
              color: #1565c0;
              letter-spacing: 0.01em;
            }
            canvas#pieChart {
              display: block;
              margin: 0 auto 24px auto;
              background: #f8fafc;
              border-radius: 8px;
              box-shadow: 0 1px 4px rgba(44,62,80,0.07);
            }
            @media (max-width: 600px) {
              .container {
                padding: 12px;
                max-width: 98vw;
              }
              canvas#pieChart {
                width: 98vw !important;
                height: auto !important;
              }
            }
          </style>
          <div class="container">
            <h2>User</h2>
            <form id="loginForm">
              <input name="username" placeholder="Username" required>
              <input name="password" type="password" placeholder="password" required>
              <button type="submit">Login</button>
            </form>
            <h2>Create Expense</h2>
            <form id="expenseForm">
              <input name="title" placeholder="Title" required>
              <input name="targetAmount" type="number" step="0.01" placeholder="Amount" required>
              <button type="submit">Create</button>
            </form>
            <button id="shareBtn" type="button" disabled style="margin-bottom:16px;">Share</button>
            <h2>Claim Share</h2>
            <form id="shareForm">
              <input name="expenseId" placeholder="Expense ID" required style="display:none">
              <input name="targetAmount" type="number" step="0.01" placeholder="Share Amount" required>
              <button type="submit">Claim</button>
            </form>
            <div id="result"></div>
            <div id="expenseTitle"></div>
            <canvas id="pieChart" width="400" height="400"></canvas>
            <button id="emoteBtn" type="button" style="margin: 16px auto 0 auto; display: block;">Celebrate 🎉</button>
            <div id="emoteContainer" style="pointer-events:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;pointer-events:none;"></div>
          </div>
        `;
        }

        connectedCallback() {
            this.shadowRoot.getElementById('loginForm').onsubmit = this.login.bind(this);
            this.shadowRoot.getElementById('expenseForm').onsubmit = this.createExpense.bind(this);
            this.shadowRoot.getElementById('shareForm').onsubmit = this.claimShare.bind(this);

            // Share button logic
            this.shadowRoot.getElementById('shareBtn').onclick = () => {
                const expenseId = localStorage.getItem('expenseId');
                if (expenseId) {
                    window.open(`participant.html?expenseId=${expenseId}`, '_blank');
                }
            };

            // If expenseId is in localStorage, auto-fill and hide expenseId input
            const expenseId = localStorage.getItem('expenseId');
            if (expenseId) {
                const expenseIdInput = this.shadowRoot.querySelector('form#shareForm input[name="expenseId"]');
                expenseIdInput.value = expenseId;
                expenseIdInput.style.display = 'none';
                this.shadowRoot.getElementById('shareBtn').disabled = false;
                this.updatePieChart();
            } else {
                this.shadowRoot.getElementById('shareBtn').disabled = true;
            }

            this.shadowRoot.getElementById('emoteBtn').onclick = () => this.dropEmoticons();
        }

        async login(e) {
            e.preventDefault();
            const form = e.target;
            const res = await fetch('http://localhost:8080/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + btoa(form.username.value + ':' + form.password.value)
                }
            });
            const token = await res.text();
            this.showResult('Token created: ' + token);
            localStorage.setItem('auth_token', token);

            // Fetch whoami and store userId
            const whoamiRes = await fetch('http://localhost:8080/whoami', {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                }
            });
            if (!whoamiRes.ok) return;
            const expense = await whoamiRes.json();
            localStorage.setItem('userId', expense.id);

            // Reset everything on login
            localStorage.removeItem('expenseId');
            localStorage.removeItem('expenseTotal');
            localStorage.removeItem('shareId');

            // Reset forms
            this.shadowRoot.getElementById('expenseForm').reset();
            this.shadowRoot.getElementById('shareForm').reset();

            // Show expenseId input again
            const expenseIdInput = this.shadowRoot.querySelector('form#shareForm input[name="expenseId"]');
            expenseIdInput.value = '';
            expenseIdInput.style.display = '';

            // Disable share button
            this.shadowRoot.getElementById('shareBtn').disabled = true;

            // Clear chart
            if (this._pieChart) {
                this._pieChart.destroy();
                this._pieChart = null;
            }
            const ctx = this.shadowRoot.getElementById('pieChart').getContext('2d');
            ctx.clearRect(0, 0, 400, 400);
        }

        async createExpense(e) {
            e.preventDefault();
            const form = e.target;
            const data = {
                title: form.title.value,
                targetAmount: parseFloat(form.targetAmount.value)
            };
            const res = await fetch('http://localhost:8080/expenses', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                },
                body: JSON.stringify(data)
            });
            const body = await res.json();
            this.showResult('Expense created: ' + JSON.stringify(body));
            localStorage.setItem('expenseId', body.id);

            // Auto-fill and hide expenseId input in claim form
            const expenseIdInput = this.shadowRoot.querySelector('form#shareForm input[name="expenseId"]');
            expenseIdInput.value = body.id;
            expenseIdInput.style.display = 'none';

            // Enable share button
            this.shadowRoot.getElementById('shareBtn').disabled = false;

            // Store total amount and title for chart
            localStorage.setItem('expenseTotal', body.targetAmount);
            localStorage.setItem('expenseTitle', body.title);

            // Draw chart (empty shares for now)
            this.updatePieChart();
        }

        async claimShare(e) {
            e.preventDefault();
            const form = e.target;
            const data = {
                targetAmount: parseFloat(form.targetAmount.value)
            };
            // Use expenseId from localStorage
            const expenseId = localStorage.getItem('expenseId');
            const res = await fetch(`http://localhost:8080/expenses/${expenseId}/shares`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                },
                body: JSON.stringify(data)
            });
            const body = await res.json();
            this.showResult('Share claimed: ' + JSON.stringify(body));
            localStorage.setItem('shareId', body.id);

            // Update chart after claiming share
            this.updatePieChart();
        }

        async payShare(e) {
            e.preventDefault();
            const form = e.target;
            const shareId = form.shareId.value;
            // Get paymentId for share
            const paymentsRes = await fetch(`http://localhost:8080/payments?internalReferenceId=${shareId}`, {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                }
            });
            const payments = await paymentsRes.json();
            const paymentId = payments.payments[0].id;
            // Initiate payment
            const res = await fetch(`http://localhost:8080/payments/${paymentId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                },
                body: JSON.stringify({ email: form.email.value })
            });
            const body = await res.json();
            this.showResult('Payment initiated: ' + JSON.stringify(body));
        }

        showResult(msg) {
            this.shadowRoot.getElementById('result').textContent = msg;
        }

        async updatePieChart() {
            const expenseId = localStorage.getItem('expenseId');
            if (!expenseId) return;

            // Set expense title above chart
            const expenseTitle = localStorage.getItem('expenseTitle') || '';
            this.shadowRoot.getElementById('expenseTitle').textContent = expenseTitle ? `Expense: ${expenseTitle}` : '';

            // Fetch shares for this expense
            const res = await fetch(`http://localhost:8080/expenses/${expenseId}/shares`, {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                }
            });
            if (!res.ok) return;
            const body = await res.json();
            const shares = body.shares || [];
            const total = parseFloat(localStorage.getItem('expenseTotal')) || 0;

            // Prepare data for chart
            const shareAmounts = shares.map(s => s.targetAmount);
            const shareLabels = shares.map(s => {
                const payed = s.status === 'PAYMENT_CONFIRMED' ? ' (Paid)' : '';
                return s.senderid == localStorage.getItem('userId') ? `Me` : `User ${s.senderid} ${payed}`
            });
            const sumShares = shareAmounts.reduce((a, b) => a + b, 0);
            const remainder = Math.max(0, total - sumShares);
            const backgroundColors = [
                '#36A2EB', '#FF6384', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#C9CBCF'
            ];
            let chartColors = backgroundColors.slice(0, shareAmounts.length);

            if (remainder > 0) {
                shareAmounts.push(remainder);
                shareLabels.push('Unclaimed');
                chartColors.push('#FF0000'); // Red for difference
            }

            // Draw or update chart
            if (!this._pieChart) {
                const ctx = this.shadowRoot.getElementById('pieChart').getContext('2d');
                this._pieChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: shareLabels,
                        datasets: [{
                            data: shareAmounts,
                            backgroundColor: chartColors
                        }]
                    },
                    options: {
                        responsive: false,
                        plugins: {
                            legend: { display: true }
                        }
                    }
                });
            } else {
                this._pieChart.data.labels = shareLabels;
                this._pieChart.data.datasets[0].data = shareAmounts;
                this._pieChart.data.datasets[0].backgroundColor = chartColors;
                this._pieChart.update();
            }
        }

        dropEmoticons() {
            const emotes = ['🎉', '🤑', '🤑', '🤑', '🤑', '🤑', '🤑', '🤑',
                '🥳', '🎊', '💸', '🍕', '🍻', '😄', '👏', '💰', '🤑','🤑',
                '💸','💸','💸','💸','💸','💸','💸','💸','💸','💸','💸','💸'

            ];
            const container = this.shadowRoot.getElementById('emoteContainer');
            const count = 30;
            for (let i = 0; i < count; i++) {
                const emote = document.createElement('div');
                emote.textContent = emotes[Math.floor(Math.random() * emotes.length)];
                emote.style.position = 'fixed';
                emote.style.left = Math.random() * 90 + 'vw';
                emote.style.top = '-3em';
                emote.style.fontSize = (Math.random() * 1.5 + 1.5) + 'em';
                emote.style.pointerEvents = 'none';
                emote.style.transition = 'transform 2.2s cubic-bezier(.23,1.02,.64,1), opacity 2.2s';
                emote.style.transform = `translateY(0) rotate(${Math.random() * 360}deg)`;
                emote.style.opacity = '1';
                container.appendChild(emote);

                setTimeout(() => {
                    emote.style.transform = `translateY(${90 + Math.random() * 10}vh) rotate(${Math.random() * 360}deg)`;
                    emote.style.opacity = '0.7';
                }, 10);

                setTimeout(() => {
                    emote.remove();
                }, 2300 + Math.random() * 400);
            }
        }
    }
    customElements.define('expense-app', ExpenseApp);
</script>
</body>
</html>
